name: Deploy Like Plugin to Digital Ocean

on:
  workflow_dispatch:    # ← allows you to click “Run workflow” in the Actions tab
  push:
    branches:
      - main
    paths:
      - 'wp-content/plugins/uifrommars-like-button/**'

jobs:
  deploy-plugin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Plugin to Digital Ocean
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # go to your plugin directory
            cd /var/www/html/wp-content/plugins/uifrommars-like-button/
            
            # if it's already a git repo, just pull
            if [ -d .git ]; then
              git pull origin main
            else
              # clone it fresh (adjust URL to your repo)
              git clone git@github.com:your-user/uimars-like-button.git .
            fi
